<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>LPU GO — Data Studio v1</title>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
:root{
  --brand:#f59e0b;--brand-h:#d97706;--success:#10b981;--danger:#ef4444;
  --info:#3b82f6;--purple:#a855f7;
  --bg:#0a0e14;--surface:#151b23;--s2:#1c242f;--s3:#252f3d;
  --text:#f8fafc;--muted:#94a3b8;--dim:#64748b;
  --border:rgba(255,255,255,.08);--border-s:rgba(255,255,255,.16);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --tb:56px;--bn:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
button{cursor:pointer;border:none;background:none;color:inherit;}
.hidden{display:none!important;}

/* LOGIN */
#login-screen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at top,#1c242f 0%,#0a0e14 70%);}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:36px 26px;
  width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 64px rgba(0,0,0,.6);}
.login-logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--brand),var(--brand-h));
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;color:#000;margin:0 auto 8px;
  box-shadow:0 12px 32px rgba(245,158,11,.4);}
.login-card h1{margin:0;text-align:center;font-size:24px;font-weight:800;letter-spacing:-.02em;}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 8px;}
.login-card input{background:var(--s2);border:1px solid var(--border);color:var(--text);
  padding:14px 16px;border-radius:12px;font-size:15px;outline:none;width:100%;}
.login-card input:focus{border-color:var(--brand);background:var(--s3);}
.btn-primary{background:var(--brand);color:#000;padding:14px 20px;border-radius:12px;font-weight:700;font-size:15px;width:100%;}
.btn-primary:hover{background:var(--brand-h);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;}
#login-error{min-height:18px;font-size:13px;color:var(--danger);text-align:center;}
.login-hint{font-size:11px;color:var(--dim);text-align:center;margin-top:4px;}

/* MAIN */
#main-screen{position:fixed;inset:0;}
#map{position:absolute;inset:0;z-index:1;}
.map-drawing .maplibregl-marker{pointer-events:none!important;}

/* TOP BAR */
.top-bar{position:absolute;top:calc(10px + var(--st));left:10px;right:10px;height:var(--tb);z-index:20;
  background:rgba(21,27,35,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:16px;display:flex;align-items:center;padding:0 8px 0 12px;gap:8px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);}
.brand-badge{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;flex-shrink:0;}
.brand-badge .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-h));
  display:flex;align-items:center;justify-content:center;color:#000;font-size:13px;font-weight:900;}
.brand-badge span{display:none;}
.search-bar{flex:1;height:40px;min-width:0;background:var(--s2);border:1px solid var(--border);
  border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:8px;}
.search-bar:focus-within{border-color:var(--brand);}
.search-bar i{color:var(--dim);font-size:14px;flex-shrink:0;}
.search-bar input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;}
.user-btn{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--info),var(--purple));
  color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* DRAW TOOLBAR */
.draw-toolbar{position:fixed;top:calc(var(--tb) + 20px + var(--st));left:12px;right:12px;z-index:30;
  background:var(--surface);border:1px solid var(--border-s);border-radius:16px;
  box-shadow:0 12px 32px rgba(0,0,0,.55);padding:10px 12px;display:flex;align-items:center;gap:10px;
  animation:sd .25s ease-out;}
@keyframes sd{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.draw-info{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
.draw-info i{color:var(--brand);flex-shrink:0;}
.draw-info .draw-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.draw-count{background:var(--brand);color:#000;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:800;flex-shrink:0;}
.draw-count.hidden{display:none;}
.draw-actions{display:flex;gap:6px;flex-shrink:0;}
.draw-btn{min-width:40px;height:40px;padding:0 12px;border-radius:10px;background:var(--s2);
  border:1px solid var(--border);color:var(--text);font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:4px;}
.draw-btn:disabled{opacity:.35;cursor:not-allowed;}
.draw-btn.draw-finish{background:var(--success);color:#fff;border-color:var(--success);}
.draw-btn.draw-finish:disabled{background:var(--s2);color:var(--dim);border-color:var(--border);}
.draw-btn.draw-finish.hidden{display:none;}
.draw-btn.draw-cancel{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3);}

/* FABs */
.fab-stack{position:absolute;right:12px;bottom:calc(var(--bn) + 16px + var(--sb));
  z-index:18;display:flex;flex-direction:column;gap:10px;}
.fab{width:50px;height:50px;border-radius:15px;background:var(--surface);border:1px solid var(--border);color:var(--text);
  display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.5);}
.fab.active{background:var(--brand);color:#000;border-color:var(--brand);}
.fab.fab-add{background:var(--brand);color:#000;border-color:var(--brand);
  box-shadow:0 6px 24px rgba(245,158,11,.5);font-size:22px;}

/* BOTTOM NAV */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:calc(var(--bn) + var(--sb));
  padding-bottom:var(--sb);z-index:20;background:rgba(21,27,35,.98);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;}
.nav-btn{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:10px;font-weight:600;position:relative;}
.nav-btn i{font-size:18px;}
.nav-btn.active{color:var(--brand);}
.nav-btn.active::before{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);
  width:28px;height:3px;background:var(--brand);border-radius:2px;}
.nav-btn.nav-add i{width:42px;height:42px;border-radius:13px;background:var(--brand);color:#000;
  display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 6px 20px rgba(245,158,11,.5);}
.nav-btn.nav-add span{color:var(--brand);}

/* SHEET */
.sheet{position:fixed;left:0;right:0;bottom:0;height:calc(88vh - var(--sb));z-index:22;
  background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.6);
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:40px;height:4px;background:var(--border-s);border-radius:2px;margin:10px auto 6px;flex-shrink:0;}
.sheet-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:4px 12px 10px;flex-shrink:0;
  border-bottom:1px solid var(--border);}
.sheet-tab{padding:10px 8px;border-radius:10px;background:transparent;color:var(--muted);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
.sheet-tab i{font-size:13px;}
.sheet-tab.active{background:var(--brand);color:#000;}
.sheet-body{flex:1;overflow-y:auto;padding:0 14px 20px;-webkit-overflow-scrolling:touch;}

.section-header{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);}
.section-header .count{background:var(--s3);color:var(--text);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;}

.filter-chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{background:var(--s2);border:1px solid var(--border);color:var(--muted);padding:7px 12px;
  border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.chip.active{background:var(--brand);border-color:var(--brand);color:#000;}
.chip .badge{display:inline-block;background:rgba(0,0,0,.2);padding:1px 6px;border-radius:8px;margin-left:4px;font-size:10px;}
.chip.active .badge{background:rgba(0,0,0,.3);color:#000;}

.items-grid{display:flex;flex-direction:column;gap:8px;}
.item-card{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:12px;
  display:flex;gap:12px;align-items:center;cursor:pointer;}
.item-card:hover{border-color:var(--border-s);background:var(--s3);}
.item-thumb{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;background:var(--s3);}
.item-main{flex:1;min-width:0;}
.item-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-code{background:var(--s3);color:var(--muted);padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;flex-shrink:0;}
.item-sub{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-actions{display:flex;gap:2px;flex-shrink:0;}
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;}
.icon-btn:hover{background:var(--s3);color:var(--text);}
.icon-btn.danger:hover{color:var(--danger);}

.empty-state{padding:40px 20px;text-align:center;}
.empty-state .emoji{font-size:44px;margin-bottom:12px;opacity:.9;}
.empty-state h3{font-size:16px;font-weight:700;margin:0 0 6px;color:var(--text);}
.empty-state p{font-size:13px;color:var(--muted);margin:0;line-height:1.5;}
.empty-state .cta{margin-top:20px;background:var(--brand);color:#000;padding:12px 24px;border-radius:12px;
  font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;}

.skeleton{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);
  background-size:200% 100%;animation:sh 1.4s infinite;border-radius:10px;height:68px;}
@keyframes sh{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* TRACK */
.track-hero{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(59,130,246,.08));
  border:1px solid rgba(16,185,129,.3);border-radius:20px;padding:24px 20px;text-align:center;margin:16px 0;}
.track-hero .distance{font-size:44px;font-weight:900;color:var(--success);line-height:1;letter-spacing:-.03em;}
.track-hero .distance-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);margin-top:8px;font-weight:700;}
.accuracy-pill{display:flex;align-items:center;gap:10px;background:var(--s2);border-radius:10px;
  padding:10px 14px;margin-bottom:14px;font-size:13px;}
.accuracy-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.accuracy-dot.good{background:var(--success);box-shadow:0 0 10px var(--success);}
.accuracy-dot.ok{background:var(--brand);box-shadow:0 0 10px var(--brand);}
.accuracy-dot.bad{background:var(--danger);box-shadow:0 0 10px var(--danger);}
.track-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.metric-card{background:var(--s2);border-radius:10px;padding:12px 8px;text-align:center;}
.metric-card .value{font-size:16px;font-weight:800;}
.metric-card .label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin-top:2px;}
.btn-record{width:100%;padding:18px;border-radius:14px;background:var(--success);color:#fff;
  font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:10px;box-shadow:0 8px 24px rgba(16,185,129,.4);}
.btn-record.recording{background:var(--danger);box-shadow:0 8px 24px rgba(239,68,68,.4);}
.btn-record:disabled{opacity:.5;cursor:not-allowed;}
.track-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-secondary{padding:14px;border-radius:12px;background:var(--s2);border:1px solid var(--border);
  color:var(--text);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-secondary:hover{background:var(--s3);border-color:var(--border-s);}
.btn-secondary:disabled{opacity:.4;cursor:not-allowed;}
.btn-danger-outline{width:100%;padding:12px;border-radius:12px;background:transparent;
  border:1px solid rgba(239,68,68,.4);color:#fca5a5;font-weight:700;font-size:14px;margin-top:10px;}

/* STATS */
.stats-hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.stat-block{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:16px;}
.stat-block .value{font-size:28px;font-weight:900;line-height:1;}
.stat-block .label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px;font-weight:700;}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);z-index:100;}
.modal{position:fixed;z-index:101;left:0;right:0;bottom:0;max-height:92vh;background:var(--surface);
  border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:su .28s cubic-bezier(.4,0,.2,1);
  box-shadow:0 -12px 40px rgba(0,0,0,.6);}
@keyframes su{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;}
.modal-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;}
.modal-close{width:34px;height:34px;border-radius:10px;background:var(--s2);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
.modal-body{flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;}
.modal-footer{padding:16px 20px calc(16px + var(--sb));border-top:1px solid var(--border);
  display:flex;gap:10px;flex-shrink:0;background:var(--surface);}
.modal-footer .btn-primary{flex:1;width:auto;}
.modal-footer .btn-cancel{flex:0 0 40%;padding:14px;border-radius:12px;border:1px solid var(--border);
  background:transparent;color:var(--text);font-weight:700;font-size:15px;}

/* FORM */
.form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.form-field:last-child{margin-bottom:0;}
.form-field label{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;}
.form-field label .req{color:var(--danger);}
.form-field input,.form-field select,.form-field textarea{background:var(--s2);
  border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;
  font-size:15px;outline:none;width:100%;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{
  border-color:var(--brand);background:var(--s3);}
.form-field textarea{resize:vertical;min-height:70px;font-family:inherit;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0;}
.chip-toggle{background:var(--s2);border:1px solid var(--border);color:var(--muted);
  padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;}
.chip-toggle.selected{background:var(--brand);border-color:var(--brand);color:#000;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.toggle{position:relative;width:46px;height:26px;background:var(--s3);border-radius:13px;
  cursor:pointer;flex-shrink:0;}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--text);
  border-radius:50%;transition:transform .2s;}
.toggle.on{background:var(--success);}
.toggle.on::after{transform:translateX(20px);background:#fff;}

/* QUICK ACTIONS */
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quick-action{background:var(--s2);border:1px solid var(--border);border-radius:14px;
  padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.quick-action:active{transform:scale(.96);}
.quick-action:hover{border-color:var(--brand);background:var(--s3);}
.quick-action .icon-wrap{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:22px;}
.quick-action .label{font-size:13px;font-weight:700;color:var(--text);}
.quick-action .sub{font-size:11px;color:var(--dim);}

/* TOAST */
#toast{position:fixed;left:50%;bottom:calc(var(--bn) + 90px + var(--sb));
  transform:translateX(-50%) translateY(100px);z-index:9999;background:var(--brand);color:#000;
  padding:12px 20px;border-radius:12px;font-weight:700;font-size:13px;max-width:90vw;text-align:center;
  box-shadow:0 12px 32px rgba(0,0,0,.5);transition:transform .28s cubic-bezier(.4,0,.2,1);pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);}
#toast.error{background:var(--danger);color:#fff;}

/* DESKTOP */
@media(min-width:768px){
  .brand-badge span{display:block;}
  .top-bar{top:calc(16px + var(--st));left:calc(440px + 16px);right:16px;height:60px;}
  .search-bar{height:44px;}
  .user-btn{width:44px;height:44px;}
  .sheet{left:16px;top:calc(16px + var(--st));bottom:16px;right:auto;width:420px;
    height:auto;border-radius:20px;transform:none!important;}
  .sheet-handle{display:none;}
  .sheet-tabs{padding:14px 16px 12px;}
  .sheet-body{padding:0 16px 20px;}
  .bottom-nav{display:none;}
  .fab-stack{bottom:calc(24px + var(--sb));right:24px;gap:12px;}
  .fab{width:54px;height:54px;font-size:20px;}
  .draw-toolbar{left:calc(440px + 24px);right:16px;top:calc(60px + 32px + var(--st));}
  .modal{left:50%;bottom:auto;top:50%;transform:translate(-50%,-50%);
    width:560px;max-height:85vh;border-radius:20px;animation:mp .24s;}
  @keyframes mp{from{opacity:0;transform:translate(-50%,-48%);}to{opacity:1;transform:translate(-50%,-50%);}}
  #toast{bottom:24px;}
}
@media(min-width:1200px){
  .sheet{width:460px;}
  .top-bar{left:calc(460px + 16px);}
  .draw-toolbar{left:calc(460px + 24px);}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">LG</div>
    <h1>LPU GO Data Studio</h1>
    <p class="sub">V1 · Outdoor navigation data collection</p>
    <form id="login-form">
      <input id="login-email" type="email" placeholder="Email" required style="margin-bottom:10px;">
      <input id="login-password" type="password" placeholder="Password" required style="margin-bottom:16px;">
      <button type="submit" class="btn-primary" id="btn-login">Sign In</button>
    </form>
    <div id="login-error"></div>
    <div class="login-hint">Ask your team lead for credentials</div>
  </div>
</div>

<!-- MAIN -->
<div id="main-screen" class="hidden">
  <div id="map"></div>

  <header class="top-bar">
    <div class="brand-badge"><div class="mark">LG</div><span>LPU GO</span></div>
    <div class="search-bar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search buildings, paths…">
    </div>
    <button class="user-btn" id="user-btn"><span id="user-initial">U</span></button>
  </header>

  <div class="draw-toolbar hidden" id="draw-toolbar">
    <div class="draw-info">
      <i class="fa-solid fa-crosshairs"></i>
      <span class="draw-text" id="draw-text">Tap map to add</span>
      <span class="draw-count" id="draw-count">0</span>
    </div>
    <div class="draw-actions">
      <button class="draw-btn" id="draw-undo"><i class="fa-solid fa-rotate-left"></i></button>
      <button class="draw-btn draw-finish" id="draw-finish">Finish</button>
      <button class="draw-btn draw-cancel" id="draw-cancel"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>

  <div class="fab-stack">
    <button class="fab fab-add" id="fab-add"><i class="fa-solid fa-plus"></i></button>
    <button class="fab" id="fab-locate"><i class="fa-solid fa-location-crosshairs"></i></button>
    <button class="fab active" id="fab-3d"><i class="fa-solid fa-cube"></i></button>
  </div>

  <aside class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-tabs">
      <button class="sheet-tab active" data-view="list"><i class="fa-solid fa-list"></i> List</button>
      <button class="sheet-tab" data-view="track"><i class="fa-solid fa-person-walking"></i> Track</button>
      <button class="sheet-tab" data-view="stats"><i class="fa-solid fa-chart-pie"></i> Stats</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </aside>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="map"><i class="fa-solid fa-map"></i><span>Map</span></button>
    <button class="nav-btn" data-nav="list"><i class="fa-solid fa-list"></i><span>List</span></button>
    <button class="nav-btn nav-add" data-nav="add"><i class="fa-solid fa-plus"></i><span>Add</span></button>
    <button class="nav-btn" data-nav="track"><i class="fa-solid fa-person-walking"></i><span>Track</span></button>
    <button class="nav-btn" data-nav="stats"><i class="fa-solid fa-chart-pie"></i><span>Stats</span></button>
  </nav>
</div>

<div class="modal-backdrop hidden" id="modal-backdrop"></div>
<div class="modal hidden" id="modal"></div>
<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="config.js"></script>

<script>
(function(){
'use strict';
const CFG = window.LPU_CONFIG;
if (!CFG){alert('config.js missing');return;}
if(CFG.supabaseUrl.includes('YOUR_PROJECT')||CFG.supabaseKey.includes('YOUR_ANON')){
  document.getElementById('login-error').innerHTML='<span style="color:var(--brand);">⚠️ Edit config.js — add Supabase URL & key</span>';
}
const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);

const state = {
  user:null, places:[], paths:[],
  activeView:'list', activeFilter:'all', searchQuery:'',
  drawMode:null, pendingVertices:[], pendingMarkers:[],
  is3D:true, map:null, loading:true,
  isRecording:false, isPaused:false, trackPoints:[], totalDistance:0,
  trackStartTime:null, trackPausedAt:null, totalPausedMs:0,
  watchId:null, lastAcceptedPoint:null, currentPosMarker:null,
};

const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg, err){
  const el=$('toast'); el.textContent=msg; el.classList.toggle('error',!!err);
  el.classList.add('show'); clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function catInfo(id){return CFG.categories.find(c=>c.id===id)||CFG.categories[CFG.categories.length-1];}
function fmtDist(m){return m>1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m';}
const isDesktop = () => window.matchMedia('(min-width: 768px)').matches;

// ========== AUTH ==========
async function checkSession(){
  try {
    const {data:{session}}=await sb.auth.getSession();
    if(session) onLogin(session.user);
  } catch(e){console.warn(e);}
}
function onLogin(user){
  state.user=user;
  $('user-initial').textContent=(user.email||'U').charAt(0).toUpperCase();
  $('login-screen').classList.add('hidden');
  $('main-screen').classList.remove('hidden');
  initMap();
  if(isDesktop()) openSheet();
}
$('login-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('login-email').value.trim();
  const pwd=$('login-password').value;
  if(!email||!pwd)return;
  $('btn-login').disabled=true; $('btn-login').textContent='Signing in…';
  $('login-error').textContent='';
  try {
    const {data,error}=await sb.auth.signInWithPassword({email,password:pwd});
    if(error)throw error;
    onLogin(data.user);
  } catch(err){
    $('login-error').textContent=err.message||'Login failed';
    $('btn-login').disabled=false; $('btn-login').textContent='Sign In';
  }
});
$('user-btn').addEventListener('click',()=>{
  if(confirm('Sign out?')){stopWatching();sb.auth.signOut().then(()=>location.reload());}
});

// ========== MAP ==========
function initMap(){
  if(state.map)return;
  state.map=new maplibregl.Map({
    container:'map',
    style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center:CFG.center, zoom:CFG.zoom, pitch:45, bearing:-15, antialias:true,
  });
  state.map.addControl(new maplibregl.NavigationControl({showCompass:true}),'top-right');
  state.map.addControl(new maplibregl.ScaleControl({unit:'metric'}),'bottom-right');
  state.map.on('load',()=>{setupLayers();loadAllData();});
  state.map.on('click',onMapClick);
}

function setupLayers(){
  const map=state.map;

  // Buildings 3D
  map.addSource('footprints-src',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({
    id:'footprints-3d', type:'fill-extrusion', source:'footprints-src',
    paint:{
      'fill-extrusion-color':['coalesce',['get','color'],'#f59e0b'],
      'fill-extrusion-height':['coalesce',['get','height'],12],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.8,
      'fill-extrusion-vertical-gradient':true,
    },
  });

  // Paths — color-coded
  map.addSource('paths-src',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({
    id:'paths-casing',type:'line',source:'paths-src',
    layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':'#000','line-width':8,'line-opacity':0.5},
  });
  map.addLayer({
    id:'paths-line',type:'line',source:'paths-src',
    layout:{'line-join':'round','line-cap':'round'},
    paint:{
      'line-color':['match',['get','path_type'],
        'footpath','#10b981',
        'road','#f97316',
        '#94a3b8'],
      'line-width':['match',['get','path_type'],
        'footpath',4,
        'road',6,
        4],
    },
  });

  // Temp line
  map.addSource('temp-line',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
  map.addLayer({id:'temp-line-layer',type:'line',source:'temp-line',
    paint:{'line-color':'#3b82f6','line-width':3,'line-dasharray':[2,2]}});

  // Track
  map.addSource('track-src',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[]}}});
  map.addLayer({id:'track-line',type:'line',source:'track-src',
    layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':'#3b82f6','line-width':5}});

  // Accuracy circle
  map.addSource('accuracy-src',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[[]]}}});
  map.addLayer({id:'accuracy-fill',type:'fill',source:'accuracy-src',
    paint:{'fill-color':'#3b82f6','fill-opacity':0.12}});
}

// ========== MAP CLICK ==========
function onMapClick(e){
  const mode=state.drawMode;
  if(!mode)return;
  const {lng,lat}=e.lngLat;

  if(mode==='entrance'||mode==='poi'){
    if(mode==='entrance'&&state.places.filter(p=>p.kind==='building').length===0){
      toast('Add a building first',true); return;
    }
    mode==='entrance'?openEntranceForm(lat,lng):openPoiForm(lat,lng);
    return;
  }

  // Draw line/polygon
  if(state.pendingVertices.length>0){
    const last=state.pendingVertices[state.pendingVertices.length-1];
    const d=turf.distance(turf.point(last),turf.point([lng,lat]),{units:'meters'});
    if(d<1)return;
  }
  state.pendingVertices.push([lng,lat]);
  addPendingMarker(lng,lat,state.pendingVertices.length===1);
  updateTempLine();
  updateDrawUI();
}

function addPendingMarker(lng,lat,isFirst){
  const el=document.createElement('div');
  const bg=isFirst?'#10b981':'#3b82f6';
  const size=isFirst?20:14;
  el.style.cssText=`width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;`;
  const m=new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(state.map);
  state.pendingMarkers.push(m);
}

function updateTempLine(){
  if(!state.map.getSource('temp-line'))return;
  const c=state.pendingVertices.slice();
  if(state.drawMode==='building'&&c.length>=3)c.push(c[0]);
  state.map.getSource('temp-line').setData({type:'Feature',geometry:{type:'LineString',coordinates:c}});
}

function clearPending(){
  state.pendingVertices=[];
  state.pendingMarkers.forEach(m=>m.remove());
  state.pendingMarkers=[];
  if(state.map&&state.map.getSource('temp-line')){
    state.map.getSource('temp-line').setData({type:'Feature',geometry:{type:'LineString',coordinates:[]}});
  }
}

function updateDrawUI(){
  const count=state.pendingVertices.length;
  const countEl=$('draw-count'); if(countEl)countEl.textContent=count;
  const undoBtn=$('draw-undo'); if(undoBtn)undoBtn.disabled=count===0;
  const min=state.drawMode==='building'?3:2;
  const finishBtn=$('draw-finish'); if(finishBtn)finishBtn.disabled=count<min;
  const textEl=$('draw-text');
  if(textEl){
    if(count===0)textEl.textContent='Tap map to start';
    else if(count<min)textEl.textContent=`Add ${min-count} more`;
    else textEl.textContent='Tap Finish when done';
  }
}

function undoLastPoint(){
  if(!state.pendingVertices.length)return;
  state.pendingVertices.pop();
  const m=state.pendingMarkers.pop(); if(m)m.remove();
  updateTempLine(); updateDrawUI();
}

function finishDrawing(){
  const mode=state.drawMode;
  const vertices=state.pendingVertices.slice();
  const min=mode==='building'?3:2;
  if(vertices.length<min){toast(`Need ${min}+ points`,true);return;}
  if(mode==='building')openBuildingForm(vertices);
  else if(mode==='footpath'||mode==='road')openPathForm(mode,vertices);
}

// ========== DRAW MODE ==========
function startDrawMode(mode){
  state.drawMode=mode;
  clearPending();
  const hints={
    building:'Draw building outline',
    footpath:'Draw footpath line',
    road:'Draw road line',
    entrance:'Tap on building to place entrance',
    poi:'Tap map to place POI',
  };
  $('draw-text').textContent=hints[mode]||'Tap map';
  const isPointMode=(mode==='entrance'||mode==='poi');
  const finishBtn=$('draw-finish'), countEl=$('draw-count');
  if(isPointMode){finishBtn.classList.add('hidden');countEl.classList.add('hidden');}
  else{finishBtn.classList.remove('hidden');countEl.classList.remove('hidden');}
  $('draw-toolbar').classList.remove('hidden');
  document.body.classList.add('map-drawing');
  updateDrawUI();
  if(!isDesktop())closeSheet();
  setActiveTab('map');
}

function cancelDrawMode(){
  state.drawMode=null;
  clearPending();
  $('draw-toolbar').classList.add('hidden');
  document.body.classList.remove('map-drawing');
}

$('draw-undo').addEventListener('click',undoLastPoint);
$('draw-finish').addEventListener('click',finishDrawing);
$('draw-cancel').addEventListener('click',cancelDrawMode);

// ========== LOAD DATA ==========
async function loadAllData(){
  try {
    const [places,paths]=await Promise.all([
      sb.from('places').select('*').order('created_at',{ascending:false}),
      sb.from('paths').select('*').order('created_at',{ascending:false}),
    ]);
    if(places.error)throw places.error;
    if(paths.error)throw paths.error;
    state.places=places.data||[];
    state.paths=paths.data||[];
    state.loading=false;
    renderFootprints(); renderPaths(); renderMarkers(); renderCurrentView();
  } catch(err){
    console.error(err);
    state.loading=false;
    toast('Load failed: '+err.message,true);
    renderCurrentView();
  }
}

let placeMarkers=[];
function renderMarkers(){
  placeMarkers.forEach(m=>m.remove());
  placeMarkers=[];
  state.places.forEach(p=>{
    if(p.kind==='building')return;  // rendered as 3D
    let icon,color,label;
    if(p.kind==='entrance'){
      icon='fa-door-open'; color='#3b82f6'; label='Entrance';
    }else{
      const cat=catInfo(p.category); icon=cat.icon; color=cat.color; label=cat.label;
    }
    const el=document.createElement('div');
    el.style.cssText=`width:28px;height:28px;border-radius:50%;background:${color};border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.5);cursor:pointer;`;
    el.innerHTML=`<i class="fa-solid ${icon}"></i>`;
    const m=new maplibregl.Marker({element:el})
      .setLngLat([p.lng,p.lat])
      .setPopup(new maplibregl.Popup({offset:20,closeButton:false}).setHTML(
        `<div style="font-family:inherit;min-width:140px;">
          <div style="color:${color};font-weight:800;font-size:14px;">${esc(p.name)}</div>
          <div style="color:#94a3b8;font-size:12px;margin-top:3px;">${label}</div>
        </div>`
      ))
      .addTo(state.map);
    placeMarkers.push(m);
  });
}

function renderFootprints(){
  if(!state.map.getSource('footprints-src'))return;
  const features=state.places.filter(p=>p.kind==='building'&&p.footprint_geojson).map(p=>{
    const cat=catInfo(p.category);
    return {
      type:'Feature',
      properties:{id:p.id,height:Number(p.height_m)||12,color:cat.color},
      geometry:p.footprint_geojson,
    };
  });
  state.map.getSource('footprints-src').setData({type:'FeatureCollection',features});
}

function renderPaths(){
  if(!state.map.getSource('paths-src'))return;
  const features=state.paths.filter(p=>p.geojson).map(p=>({
    type:'Feature',
    properties:{id:p.id,path_type:p.path_type,name:p.name},
    geometry:p.geojson,
  }));
  state.map.getSource('paths-src').setData({type:'FeatureCollection',features});
}

// ========== SHEET ==========
function openSheet(){$('sheet').classList.add('open');}
function closeSheet(){if(!isDesktop())$('sheet').classList.remove('open');}
function setActiveTab(view){
  document.querySelectorAll('.sheet-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===view));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));
  state.activeView=view;
}
document.querySelectorAll('.sheet-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{setActiveTab(tab.dataset.view);renderCurrentView();});
});
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const v=btn.dataset.nav;
    if(v==='map'){closeSheet();setActiveTab('map');return;}
    if(v==='add'){openAddMenu();return;}
    setActiveTab(v);renderCurrentView();openSheet();
  });
});

function renderCurrentView(){
  if(state.loading){
    $('sheet-body').innerHTML=`
      <div class="section-header"><span>Loading…</span></div>
      <div class="items-grid"><div class="skeleton"></div><div class="skeleton"></div></div>`;
    return;
  }
  if(state.activeView==='track')renderTrackView();
  else if(state.activeView==='stats')renderStatsView();
  else renderListView();
}

// ========== LIST ==========
function renderListView(){
  const q=state.searchQuery.toLowerCase();
  const buildings=state.places.filter(p=>p.kind==='building');
  const entrances=state.places.filter(p=>p.kind==='entrance');
  const pois=state.places.filter(p=>p.kind==='poi');
  const footpaths=state.paths.filter(p=>p.path_type==='footpath');
  const roads=state.paths.filter(p=>p.path_type==='road');

  const filters=[
    {id:'all',      label:'All',       count:state.places.length+state.paths.length},
    {id:'buildings',label:'🏢 Buildings', count:buildings.length},
    {id:'entrances',label:'🚪 Entrances', count:entrances.length},
    {id:'pois',     label:'📍 Places',  count:pois.length},
    {id:'footpaths',label:'🛤 Footpaths',count:footpaths.length},
    {id:'roads',    label:'🛣 Roads',    count:roads.length},
  ];

  const items=[];
  const match=(t)=>!q||(t||'').toLowerCase().includes(q);
  const af=state.activeFilter;

  if(af==='all'||af==='buildings')
    buildings.filter(b=>match(b.name+' '+(b.short_code||''))).forEach(b=>items.push({kind:'building',item:b}));
  if(af==='all'||af==='entrances')
    entrances.filter(e=>match(e.name)).forEach(e=>items.push({kind:'entrance',item:e}));
  if(af==='all'||af==='pois')
    pois.filter(p=>match(p.name)).forEach(p=>items.push({kind:'poi',item:p}));
  if(af==='all'||af==='footpaths')
    footpaths.filter(p=>match(p.name||'')).forEach(p=>items.push({kind:'path',item:p}));
  if(af==='all'||af==='roads')
    roads.filter(p=>match(p.name||'')).forEach(p=>items.push({kind:'path',item:p}));

  const chips=filters.map(f=>
    `<button class="chip ${af===f.id?'active':''}" data-filter="${f.id}">${f.label} <span class="badge">${f.count}</span></button>`
  ).join('');

  $('sheet-body').innerHTML=`
    <div class="filter-chips">${chips}</div>
    <div class="section-header"><span>${q?'Results':'Items'}</span><span class="count">${items.length}</span></div>
    ${items.length===0?`
      <div class="empty-state">
        <div class="emoji">📭</div>
        <h3>${q?'No matches':'Nothing here yet'}</h3>
        <p>${q?'Try another search':'Tap + to add your first item'}</p>
        ${!q?`<button class="cta" onclick="window.openAddMenu()"><i class="fa-solid fa-plus"></i> Add data</button>`:''}
      </div>`:
      `<div class="items-grid">${items.map(renderItemCard).join('')}</div>`}
  `;

  document.querySelectorAll('.filter-chips .chip').forEach(c=>{
    c.addEventListener('click',()=>{state.activeFilter=c.dataset.filter;renderListView();});
  });
  bindItemActions();
}

function renderItemCard({kind,item}){
  let icon,color,title,subtitle;

  if(kind==='building'){
    const cat=catInfo(item.category);
    icon=`<i class="fa-solid fa-building" style="color:${cat.color};"></i>`;
    color=cat.color; title=item.name;
    subtitle=`${item.short_code?item.short_code+' · ':''}${item.floors?item.floors+' floors':'Building'}`;
  }else if(kind==='entrance'){
    icon='🚪'; color='#3b82f6'; title=item.name;
    subtitle=`${item.entrance_type||'main'} entrance`;
  }else if(kind==='poi'){
    const cat=catInfo(item.category);
    icon=`<i class="fa-solid ${cat.icon}" style="color:${cat.color};"></i>`;
    color=cat.color; title=item.name;
    subtitle=cat.label;
  }else if(kind==='path'){
    const isRoad=item.path_type==='road';
    icon=isRoad?'🛣':'🛤'; color=isRoad?'#f97316':'#10b981';
    title=item.name||(isRoad?'Unnamed road':'Unnamed footpath');
    const coords=item.geojson?.coordinates||[];
    const dist=coords.length>1?turf.length(turf.lineString(coords),{units:'meters'}):0;
    subtitle=`${isRoad?'Road':'Footpath'} · ${fmtDist(dist)}`;
  }

  const canDelete=item.created_by===state.user.id;
  const showEdit=(kind==='building'||kind==='poi'||kind==='entrance');

  return `
    <div class="item-card" data-kind="${kind}" data-id="${item.id}">
      <div class="item-thumb" style="background:${color}20;">${icon}</div>
      <div class="item-main">
        <div class="item-title">${esc(title)}</div>
        <div class="item-sub">${esc(subtitle)}</div>
      </div>
      <div class="item-actions">
        ${showEdit?`<button class="icon-btn" data-edit="${item.id}" data-kind="${kind}"><i class="fa-solid fa-pen"></i></button>`:''}
        ${canDelete?`<button class="icon-btn danger" data-delete="${item.id}" data-table="${kind==='path'?'paths':'places'}"><i class="fa-solid fa-trash"></i></button>`:''}
      </div>
    </div>
  `;
}

function bindItemActions(){
  document.querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click',e=>{
      if(e.target.closest('.icon-btn'))return;
      flyToItem(card.dataset.kind,card.dataset.id);
    });
  });
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      const item=state.places.find(p=>p.id===btn.dataset.edit);
      if(item)openEditForm(item);
    });
  });
  document.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click',async e=>{
      e.stopPropagation();
      if(!confirm('Delete?'))return;
      const {error}=await sb.from(btn.dataset.table).delete().eq('id',btn.dataset.delete);
      if(error){toast('Delete failed',true);return;}
      toast('Deleted');
      await loadAllData();
    });
  });
}

function flyToItem(kind,id){
  if(kind==='path'){
    const item=state.paths.find(p=>p.id===id);
    if(item?.geojson?.coordinates?.length){
      const coords=item.geojson.coordinates;
      const bounds=coords.reduce((b,c)=>b.extend(c),new maplibregl.LngLatBounds(coords[0],coords[0]));
      state.map.fitBounds(bounds,{padding:80,pitch:50,duration:900});
    }
  }else{
    const item=state.places.find(p=>p.id===id);
    if(item)state.map.flyTo({center:[item.lng,item.lat],zoom:19,pitch:55,duration:900});
  }
  if(!isDesktop())closeSheet();
}

$('search-input').addEventListener('input',e=>{
  state.searchQuery=e.target.value.trim();
  if(state.activeView!=='list')setActiveTab('list');
  renderCurrentView();
  if(!isDesktop())openSheet();
});

// ========== ADD MENU ==========
function openAddMenu(){
  const items=[
    {id:'building', label:'Building',  sub:'Draw outline',   icon:'fa-building',      bg:'rgba(245,158,11,.15)',  fg:'#f59e0b'},

// ========== MODAL ==========
function showModal(html,onSave){
  $('modal').innerHTML=html;
  $('modal').classList.remove('hidden');
  $('modal-backdrop').classList.remove('hidden');
  document.body.style.overflow='hidden';
  bindToggles(); bindAmenityChips();
  if(onSave){
    const btn=$('modal-save');
    if(btn)btn.onclick=async()=>{
      btn.disabled=true;
      const orig=btn.textContent; btn.textContent='Saving…';
      try{await onSave();}
      catch(err){
        console.error(err);
        toast('Error: '+(err.message||err),true);
        btn.disabled=false; btn.textContent=orig;
      }
    };
  }
}
function closeModal(){
  $('modal').classList.add('hidden');
  $('modal-backdrop').classList.add('hidden');
  $('modal').innerHTML='';
  document.body.style.overflow='';
}
window.closeModal=closeModal;
$('modal-backdrop').addEventListener('click',closeModal);

function bindToggles(){
  document.querySelectorAll('.toggle').forEach(t=>{
    if(t.dataset.bound)return;
    t.dataset.bound='1';
    t.addEventListener('click',()=>t.classList.toggle('on'));
  });
}
function bindAmenityChips(){
  document.querySelectorAll('#amenity-group .chip-toggle').forEach(c=>{
    if(c.dataset.bound)return;
    c.dataset.bound='1';
    c.addEventListener('click',()=>c.classList.toggle('selected'));
  });
}

// ========== GPS TRACK ==========
function renderTrackView(){
  $('sheet-body').innerHTML=`
    <div class="track-hero">
      <div class="distance" id="track-dist">${fmtDist(state.totalDistance)}</div>
      <div class="distance-label">Distance walked</div>
    </div>
    <div class="accuracy-pill">
      <div class="accuracy-dot bad" id="track-acc-dot"></div>
      <span>GPS accuracy: <b id="track-acc-text">${state.watchId?'Waiting…':'Not started'}</b></span>
    </div>
    <div class="track-metrics">
      <div class="metric-card"><div class="value" id="track-time">0:00</div><div class="label">Time</div></div>
      <div class="metric-card"><div class="value" id="track-points">${state.trackPoints.length}</div><div class="label">Points</div></div>
      <div class="metric-card"><div class="value" id="track-speed">0.0</div><div class="label">km/h</div></div>
    </div>
    <button class="btn-record ${state.isRecording?'recording':''}" id="btn-record" ${state.isRecording?'disabled':''}>
      <i class="fa-solid fa-${state.isRecording?'circle-stop':'circle'}"></i>
      ${state.isRecording?'Recording…':'Start Recording'}
    </button>
    <div class="track-controls">
      <button class="btn-secondary" id="btn-pause" ${!state.isRecording?'disabled':''}>
        <i class="fa-solid fa-${state.isPaused?'play':'pause'}"></i> ${state.isPaused?'Resume':'Pause'}
      </button>
      <button class="btn-secondary" id="btn-stop" ${!state.isRecording?'disabled':''}>
        <i class="fa-solid fa-stop"></i> Stop & Save
      </button>
    </div>
    ${state.trackPoints.length>0&&!state.isRecording?`<button class="btn-danger-outline" id="btn-discard"><i class="fa-solid fa-trash"></i> Discard</button>`:''}
    <div style="margin-top:20px;padding:14px;background:var(--s2);border-radius:10px;font-size:12px;color:var(--muted);line-height:1.6;">
      <b style="color:var(--text);">📌 GPS mode:</b> Walk along the path. Records every few meters, filters noise automatically.
    </div>
  `;
  bindTrackControls();
}

function bindTrackControls(){
  const rec=$('btn-record'); if(rec&&!state.isRecording)rec.onclick=startRecording;
  const pause=$('btn-pause'); if(pause)pause.onclick=state.isPaused?resumeRecording:pauseRecording;
  const stop=$('btn-stop'); if(stop)stop.onclick=stopRecording;
  const disc=$('btn-discard'); if(disc)disc.onclick=()=>{if(confirm('Discard?')){clearTrack();renderTrackView();}};
}

function startRecording(){
  if(!navigator.geolocation){toast('GPS unavailable',true);return;}
  state.isRecording=true; state.isPaused=false;
  state.trackPoints=[]; state.totalDistance=0;
  state.trackStartTime=Date.now(); state.trackPausedAt=null;
  state.totalPausedMs=0; state.lastAcceptedPoint=null;
  state.watchId=navigator.geolocation.watchPosition(
    onPositionUpdate,onPositionError,
    {enableHighAccuracy:true,maximumAge:0,timeout:15000}
  );
  renderTrackView(); toast('Recording started');
  if(!isDesktop())closeSheet();
}

function onPositionUpdate(pos){
  const {latitude,longitude,accuracy,speed}=pos.coords;
  const dot=$('track-acc-dot'), txt=$('track-acc-text');
  if(txt)txt.textContent=accuracy?Math.round(accuracy)+' m':'—';
  if(dot)dot.className='accuracy-dot '+(accuracy<=10?'good':accuracy<=25?'ok':'bad');
  updateCurrentPos(longitude,latitude,accuracy);
  if(!state.isRecording||state.isPaused)return;
  if(accuracy&&accuracy>30)return;
  if(state.lastAcceptedPoint){
    const d=turf.distance(
      turf.point([state.lastAcceptedPoint.lng,state.lastAcceptedPoint.lat]),
      turf.point([longitude,latitude]),{units:'meters'}
    );
    if(d<2)return;
    state.totalDistance+=d;
  }
  const p={lng:longitude,lat:latitude,accuracy,timestamp:pos.timestamp};
  state.trackPoints.push(p); state.lastAcceptedPoint=p;
  updateTrackLine(); updateTrackStats(speed);
}

function onPositionError(err){toast('GPS: '+(err.message||'error'),true);}

function updateCurrentPos(lng,lat,accuracy){
  if(!state.currentPosMarker){
    const el=document.createElement('div');
    el.style.cssText='width:18px;height:18px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 12px rgba(59,130,246,.8);pointer-events:none;';
    state.currentPosMarker=new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(state.map);
  }else state.currentPosMarker.setLngLat([lng,lat]);
  if(state.map.getSource('accuracy-src')&&accuracy){
    state.map.getSource('accuracy-src').setData(turf.circle([lng,lat],accuracy/1000,{steps:32,units:'kilometers'}));
  }
}

function updateTrackLine(){
  if(!state.map.getSource('track-src'))return;
  state.map.getSource('track-src').setData({
    type:'Feature',
    geometry:{type:'LineString',coordinates:state.trackPoints.map(p=>[p.lng,p.lat])},
  });
}

function updateTrackStats(speed){
  const d=$('track-dist'); if(d)d.textContent=fmtDist(state.totalDistance);
  const p=$('track-points'); if(p)p.textContent=state.trackPoints.length;
  const s=$('track-speed'); if(s)s.textContent=speed?(speed*3.6).toFixed(1):'0.0';
  const t=$('track-time');
  if(t&&state.trackStartTime){
    let elapsed=Date.now()-state.trackStartTime-state.totalPausedMs;
    if(state.isPaused&&state.trackPausedAt)elapsed-=(Date.now()-state.trackPausedAt);
    const m=Math.floor(elapsed/60000);
    const sec=Math.floor((elapsed%60000)/1000);
    t.textContent=`${m}:${sec.toString().padStart(2,'0')}`;
  }
}

function pauseRecording(){
  if(!state.isRecording||state.isPaused)return;
  state.isPaused=true; state.trackPausedAt=Date.now(); renderTrackView();
}
function resumeRecording(){
  if(!state.isRecording||!state.isPaused)return;
  state.isPaused=false;
  if(state.trackPausedAt){state.totalPausedMs+=Date.now()-state.trackPausedAt;state.trackPausedAt=null;}
  renderTrackView();
}
function stopWatching(){
  if(state.watchId!==null){navigator.geolocation.clearWatch(state.watchId);state.watchId=null;}
}
function stopRecording(){
  stopWatching();
  state.isRecording=false; state.isPaused=false;
  if(state.trackPoints.length<2){toast('Too short',true);clearTrack();renderTrackView();return;}
  openTrackSaveForm();
}
function clearTrack(){
  state.trackPoints=[]; state.totalDistance=0; state.trackStartTime=null;
  state.trackPausedAt=null; state.totalPausedMs=0; state.lastAcceptedPoint=null;
  if(state.map.getSource('track-src')){
    state.map.getSource('track-src').setData({type:'Feature',geometry:{type:'LineString',coordinates:[]}});
  }
  if(state.map.getSource('accuracy-src')){
    state.map.getSource('accuracy-src').setData({type:'Feature',geometry:{type:'Polygon',coordinates:[[]]}});
  }
  if(state.currentPosMarker){state.currentPosMarker.remove();state.currentPosMarker=null;}
}

function openTrackSaveForm(){
  const coords=state.trackPoints.map(p=>[p.lng,p.lat]);
  const simplified=turf.simplify(turf.lineString(coords),{tolerance:0.00003,highQuality:true});
  const finalCoords=simplified.geometry.coordinates;
  const dist=turf.length(simplified,{units:'meters'});
  const dur=Math.round((Date.now()-state.trackStartTime-state.totalPausedMs)/60000);

  showModal(`
    <div class="modal-header">
      <div class="modal-title">💾 Save Track</div>
      <button class="modal-close" onclick="window.closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div style="background:var(--s2);padding:14px;border-radius:12px;margin-bottom:16px;font-size:13px;line-height:1.7;">
        📏 <b>${fmtDist(dist)}</b> · ⏱ <b>${dur} min</b> · 📍 <b>${finalCoords.length} pts</b>
      </div>
      <div class="form-field"><label>Type <span class="req">*</span></label>
        <select id="f-type">
          <option value="footpath">Footpath</option>
          <option value="road">Road</option>
        </select></div>
      <div class="form-field"><label>Name <span class="req">*</span></label>
        <input type="text" id="f-name" placeholder="Main Gate → Block 27" autofocus></div>
      <div class="form-field"><label>Notes</label>
        <textarea id="f-notes"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="window.closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-save">Save Track</button>
    </div>
  `,async()=>{
    const name=$('f-name').value.trim();
    if(!name){toast('Name required',true);return;}
    const {error}=await sb.from('paths').insert({
      name,
      path_type:$('f-type').value,
      geojson:{type:'LineString',coordinates:finalCoords},
      notes:$('f-notes').value.trim()||null,
      created_by:state.user.id,
      created_by_email:state.user.email,
    });
    if(error)throw error;
    closeModal(); clearTrack(); toast('Track saved ✓');
    await loadAllData(); renderTrackView();
  });
}

// ========== STATS ==========
function renderStatsView(){
  const buildings=state.places.filter(p=>p.kind==='building').length;
  const entrances=state.places.filter(p=>p.kind==='entrance').length;
  const pois=state.places.filter(p=>p.kind==='poi').length;
  const footpaths=state.paths.filter(p=>p.path_type==='footpath').length;
  const roads=state.paths.filter(p=>p.path_type==='road').length;
  const total=state.places.length+state.paths.length;

  const contributors={};
  [...state.places,...state.paths].forEach(x=>{
    const e=x.created_by_email||'unknown';
    contributors[e]=(contributors[e]||0)+1;
  });

  $('sheet-body').innerHTML=`
    <div class="section-header"><span>Overview</span></div>
    <div class="stats-hero">
      <div class="stat-block"><div class="value">${total}</div><div class="label">Total items</div></div>
      <div class="stat-block"><div class="value">${buildings}</div><div class="label">Buildings</div></div>
      <div class="stat-block"><div class="value">${entrances}</div><div class="label">Entrances</div></div>
      <div class="stat-block"><div class="value">${pois}</div><div class="label">POIs</div></div>
      <div class="stat-block"><div class="value">${footpaths}</div><div class="label">Footpaths</div></div>
      <div class="stat-block"><div class="value">${roads}</div><div class="label">Roads</div></div>
    </div>
    <div class="section-header"><span>Contributors</span></div>
    <div class="items-grid">
      ${Object.entries(contributors).map(([email,count])=>`
        <div class="item-card" style="cursor:default;">
          <div class="item-thumb" style="background:var(--s3);color:var(--text);font-weight:800;font-size:14px;">${email.charAt(0).toUpperCase()}</div>
          <div class="item-main">
            <div class="item-title">${esc(email)}</div>
            <div class="item-sub">${count} item${count>1?'s':''}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="section-header"><span>Export</span></div>
    <div style="display:flex;gap:10px;margin-bottom:16px;">
      <button class="btn-secondary" id="btn-export-json" style="flex:1;"><i class="fa-solid fa-code"></i> JSON</button>
      <button class="btn-secondary" id="btn-export-geojson" style="flex:1;"><i class="fa-solid fa-map"></i> GeoJSON</button>
    </div>
  `;
  $('btn-export-json').onclick=exportJSON;
  $('btn-export-geojson').onclick=exportGeoJSON;
}

function downloadFile(name,data){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url); toast('Downloaded');
}
function exportJSON(){
  downloadFile('lpu-v1-'+new Date().toISOString().slice(0,10)+'.json',{
    places:state.places, paths:state.paths,
  });
}
function exportGeoJSON(){
  const features=[
    ...state.places.filter(p=>p.kind==='building').map(p=>({
      type:'Feature',
      properties:{
        kind:'building',id:p.id,name:p.name,short_code:p.short_code,
        full_name:p.full_name,category:p.category,floors:p.floors,height:p.height_m,
        is_accessible:p.is_accessible,description:p.description,
      },
      geometry:p.footprint_geojson,
    })),
    ...state.places.filter(p=>p.kind==='entrance').map(p=>({
      type:'Feature',
      properties:{
        kind:'entrance',id:p.id,name:p.name,
        parent_building:p.parent_building_id,entrance_type:p.entrance_type,
        is_accessible:p.is_accessible,
      },
      geometry:{type:'Point',coordinates:[p.lng,p.lat]},
    })),
    ...state.places.filter(p=>p.kind==='poi').map(p=>({
      type:'Feature',
      properties:{
        kind:'poi',id:p.id,name:p.name,short_code:p.short_code,
        category:p.category,parent_building:p.parent_building_id,
        is_accessible:p.is_accessible,description:p.description,
      },
      geometry:{type:'Point',coordinates:[p.lng,p.lat]},
    })),
    ...state.paths.map(p=>({
      type:'Feature',
      properties:{
        kind:'path',id:p.id,name:p.name,path_type:p.path_type,
        width_m:p.width_m,surface:p.surface,is_lit:p.is_lit,is_accessible:p.is_accessible,
      },
      geometry:p.geojson,
    })),
  ];
  downloadFile('lpu-v1-'+new Date().toISOString().slice(0,10)+'.geojson',{
    type:'FeatureCollection', features,
  });
}

// ========== FABs ==========
$('fab-add').addEventListener('click',openAddMenu);
$('fab-locate').addEventListener('click',()=>{
  if(!navigator.geolocation){toast('No GPS',true);return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{state.map.flyTo({center:[pos.coords.longitude,pos.coords.latitude],zoom:18,pitch:55});toast('Located');},
    ()=>toast('GPS denied',true),
    {enableHighAccuracy:true,timeout:8000}
  );
});
$('fab-3d').addEventListener('click',e=>{
  state.is3D=!state.is3D;
  e.currentTarget.classList.toggle('active',state.is3D);
  state.map.easeTo({pitch:state.is3D?50:0,bearing:state.is3D?-15:0,duration:800});
  if(state.map.getLayer('footprints-3d')){
    state.map.setLayoutProperty('footprints-3d','visibility',state.is3D?'visible':'none');
  }
});

// ========== INIT ==========
checkSession();
})();
</script>
</body>
